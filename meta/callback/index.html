<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Connecting</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 3rem auto; max-width: 32rem; padding: 0 1rem; color: #222; background: #fff; }
  code { background: #f2f2f2; padding: 0 .25rem; }
</style>
</head>
<body>
<p>Sending you back to the local dashboard...</p>
<p>If nothing happens, make sure the dashboard is running (<code>clip dashboard</code>) and
<a id="go" href="http://127.0.0.1:8765/oauth/meta/callback">continue</a>.</p>
<script>
  // Meta only accepts HTTPS redirect URIs. This page hands the query string (code, state, or
  // error) to the dashboard on this machine. The code is useless without the app secret.
  var target = "http://127.0.0.1:8765/oauth/meta/callback" + window.location.search;
  document.getElementById("go").href = target;
  window.location.replace(target);
</script>
</body>
</html>
